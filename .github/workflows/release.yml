name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pester 5.7.1
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: La etiqueta coincide con la versión del código
        shell: pwsh
        run: |
          $v = [regex]::Match((Get-Content modules/Core.psm1 -Raw), "AmonVersion = '([^']+)'").Groups[1].Value
          if ("v$v" -ne '${{ github.ref_name }}') { throw "La etiqueta ${{ github.ref_name }} no coincide con la versión $v de modules/Core.psm1." }
      - name: Construir (pruebas incluidas)
        shell: pwsh
        run: ./tools/Build-Release.ps1 -Owner '${{ github.repository_owner }}' -Repository '${{ github.event.repository.name }}'
      - name: Publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' "release/Amon-SS-$v.zip" release/SHA256SUMS.txt release/INSTALL-CMD.txt --title "Amon SS $v" --notes-file release/RELEASE-NOTES.md
